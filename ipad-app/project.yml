name: USBDeck
options:
  bundleIdPrefix: com.usbdeck
  deploymentTarget:
    iOS: "15.0"
targets:
  USBDeck:
    type: application
    platform: iOS
    sources:
      - path: Sources
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: USBDeck
        PRODUCT_BUNDLE_IDENTIFIER: com.usbdeck.app
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: Support/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: USB Deck
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: USB Deck komunikon me kompjuterin përmes kabllos USB.
